name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this job to clone the repo and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The project uses emptyOutDir:false + clean_dist.mjs (some sandboxes
      # guard bulk deletes). Clean first so the build output is deterministic.
      - name: Clean previous build
        run: node scripts/clean_dist.mjs

      - name: Build
        run: npm run build

      # enablement: true makes the action turn on GitHub Pages for this repo
      # on first run (it is OFF by default, which is what caused the
      # "Get Pages site failed / Not Found" error). The top-level
      # `pages: write` permission above is what allows this.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
